name: CD - Auto Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/carinclaim_ci_key
          chmod 600 ~/.ssh/carinclaim_ci_key

      - name: Verify SSH key format
        run: |
          ssh-keygen -l -f ~/.ssh/carinclaim_ci_key

      - name: Test SSH connection
        run: |
          ssh -vvv \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -i ~/.ssh/carinclaim_ci_key \
            ubuntu@${{ secrets.DEPLOY_HOST }} "echo SSH connection successful"

      - name: Deploy to EC2
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -i ~/.ssh/carinclaim_ci_key \
            ubuntu@${{ secrets.DEPLOY_HOST }} << 'EOF'
              set -e
              cd ~/apps/carinclaim
              git checkout main
              git pull origin main
              docker compose down
              docker compose up --build -d
          EOF
