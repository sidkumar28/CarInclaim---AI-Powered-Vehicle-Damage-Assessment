name: CD - Auto Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Test SSH connection
        run: |
          ssh -o StrictHostKeyChecking=no \
              -i ~/.ssh/id_ed25519 \
              ubuntu@${{ secrets.DEPLOY_HOST }} "echo SSH SUCCESS"

      - name: Deploy
        run: |
          ssh -o StrictHostKeyChecking=no \
              -i ~/.ssh/id_ed25519 \
              ubuntu@${{ secrets.DEPLOY_HOST }} << 'EOF'
            set -e
            mkdir -p ~/apps
            cd ~/apps
            if [ ! -d carinclaim ]; then
              git clone https://github.com/${{ github.repository }}.git carinclaim
            fi
            cd carinclaim
            git checkout main
            git pull origin main
            docker compose down || true
            docker compose up --build -d
          EOF
